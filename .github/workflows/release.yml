name: Release

# Push a tag like v0.2.0 (matching manifest.json "version") to build the zips and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Build packages
        run: bun scripts/pack.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## 安装

          **Chrome / Edge**：下载 `duet-translate-*-chromium.zip` 并解压到一个文件夹，打开 `chrome://extensions`（或 `edge://extensions`），开启「开发者模式」，点「加载已解压的扩展程序」，选择解压出来的文件夹。

          **Firefox**：下载 `duet-translate-*-firefox.zip`，打开 `about:debugging#/runtime/this-firefox`，点「临时载入附加组件」并选择这个 zip。

          > 解压后的文件夹不要删除或移动，浏览器每次启动都从这里加载扩展。更新时用新版本覆盖文件夹里的文件，然后在扩展页点「重新加载」。

          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Duet Translate $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
