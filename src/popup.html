<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Duet Translate</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="content.css">
  <style>
    body { width: 340px; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; }
    header img { width: 20px; height: 20px; }
    header .brand { font-weight: 600; }
    header .site { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; text-align: right; }

    .hero { display: grid; gap: 12px; padding: 0 16px 12px; }
    .hero .preview { padding: 10px 14px; font-size: 13px; line-height: 1.65; }
    #toggle { width: 100%; height: 40px; font-size: 15px; }
    #toggle.on { background: var(--bg); border-color: var(--line); color: var(--fg); }
    #toggle.on:hover { background: var(--hover); }
    .status { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-height: 20px; margin-top: -4px; font-size: 12px; color: var(--muted); }
    .status button { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 500; cursor: pointer; }
    .status .err { color: var(--danger); }

    .rows { border-top: 1px solid var(--line); padding: 4px 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
    .row + .row { border-top: 1px solid var(--line); }
    .row > span { color: var(--fg-2); font-size: 13px; }
    .row select { width: 168px; height: 32px; font-size: 13px; }
    .row.stack { flex-direction: column; align-items: stretch; gap: 6px; padding: 10px 0; }
    .chips .chip { padding: 2px 8px; }

    footer { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--sunken); font-size: 12px; color: var(--muted); }
    footer span { display: inline-flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="">
    <span class="brand">Duet Translate</span>
    <span class="site" id="site"></span>
    <button class="icon-btn" id="options" title="打开设置" aria-label="打开设置">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <section class="hero">
    <div class="preview" id="preview">
      <span class="orig">Reading two languages side by side slows you down in a good way.</span>
      <font class="duet-wrapper duet-block"><font class="duet-inner" id="previewText"></font></font>
    </div>
    <p class="notice" id="engineNotice" hidden><span id="engineProblem"></span><a href="#" id="fixEngine">去填写</a></p>
    <button class="btn primary" id="toggle">翻译此页</button>
    <p class="status" id="status"></p>
  </section>

  <section class="rows">
    <div class="row"><span>翻译成</span><select id="targetLang" aria-label="翻译成"></select></div>
    <div class="row"><span>翻译服务</span><select id="engine" aria-label="翻译服务"></select></div>
    <div class="row"><span>显示</span>
      <div class="seg" role="radiogroup" aria-label="显示">
        <label><input type="radio" name="displayMode" value="bilingual"><span>双语对照</span></label>
        <label><input type="radio" name="displayMode" value="translation"><span>只看译文</span></label>
      </div>
    </div>
    <div class="row stack"><span>译文样式</span><div class="chips" id="styles" role="radiogroup" aria-label="译文样式"></div></div>
    <div class="row" id="siteRow"><span>这个网站</span>
      <div class="seg" role="radiogroup" aria-label="这个网站">
        <label><input type="radio" name="siteRule" value="default"><span>手动</span></label>
        <label><input type="radio" name="siteRule" value="always"><span>总是翻译</span></label>
        <label><input type="radio" name="siteRule" value="never"><span>从不翻译</span></label>
      </div>
    </div>
  </section>

  <footer>
    <span><kbd>Alt</kbd><kbd>A</kbd> 翻译</span>
    <span id="hoverHint"></span>
  </footer>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
